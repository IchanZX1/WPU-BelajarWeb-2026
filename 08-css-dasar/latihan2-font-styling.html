<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: rgb(48, 48, 48);
            text-align: center;
        }

        h1 {
            font-size: 47px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 8px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: gray;
            text-shadow: 3px 3px 0 rgb(187, 187, 187);
        }

        .quote {
            font-size: 25px;
            line-height: 2.2;
            word-spacing: 5px;
        }
    </style>
</head>
<body>
    <h1>FASE RUNTUH</h1>
    <p class="quote">"Tak perlu khawatir, ku hanya <span style="color: gray; text-decoration: line-through;">Terluka</span>. <br> Terbiasa tuk berpura-pura tertawa. <br> Namun bolehkah sekali saja ku menangis? <br> sebelum kembali membohongi diri "</p>

    <p style="font-size: 15px; letter-spacing: 3px; color: rgb(180, 180, 180); font-weight: normal;">- feby putri feat. fiersa besari</p>
</body>
</html>
