<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #F8F8FF;
            text-align: center;
            background-color: #0f172A;
            background-image: linear-gradient(to bottom, rgb(15 23 42 / 90%), rgb(15 23 42 / 40%)) ,url('https://fastly.picsum.photos/id/10/1000/1000.jpg?hmac=8imXWM_Cxe6_cWjyUbT2Vh7oxwiz12HfzJHp6CLoGwM');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
        }

        h1, p {
            margin: 0;
        }

        h1 {
            font-size: 4em;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 8px;
            text-decoration: none;
            /* text-shadow: 3px 3px 0 rgb(187 187 187 / 10%); */
            background-image: linear-gradient(to right, rgb(56, 138, 231), rgb(250, 91, 250));
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(147, 247, 213, 0.5));
        }

        .quote {
            font-size: 25px;
            line-height: 2.2;
            word-spacing: 5px;
            background-color: rgb(255 255 255 / 5%);
            max-width: 700px;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgb(255 255 255 / 15%);
            box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
        }
    </style>
</head>
<body>
    <h1>FASE Runtuh</h1>
    <p class="quote">"Tak perlu khawatir, ku hanya <span style="color: rgb(158, 14, 14); text-decoration: line-through;">Terluka</span>. <br> Terbiasa tuk berpura-pura tertawa. <br> Namun bolehkah sekali saja ku menangis? <br> sebelum kembali membohongi diri "</p>

    <p style="font-size: 15px; letter-spacing: 3px; color: rgb(180, 180, 180); font-weight: normal; text-transform: uppercase;">- feby putri feat. fiersa besari</p>
</body>
</html>
