<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Background</title>
    <style>
        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #333;
        }

        .frame {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 400px;
            border: 10px solid white;
            margin: auto;
            background-image: url(img/vector.png), url(img/character.png), url(img/liquid.png);
            background-size: 430px, 320px;
            background-repeat: no-repeat, no-repeat;
            background-position: center bottom -4px, center bottom;
            background-color: lightblue;
            border-radius: 50%;
        }

        h1 {
            color: #fff;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            text-shadow: 2px 2px 4px #000;
        }

        .tag {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 40px;
            color: #fff;
            text-align: center;
            background-color: rgb(0 0 0 /70%);
        }
    </style>
</head>
<body>
    <h1>My Profile Card</h1>
    <div class="frame">
        <div class="tag">Hirara Of MLBB Hero</div>
    </div>
</body>
</html>
