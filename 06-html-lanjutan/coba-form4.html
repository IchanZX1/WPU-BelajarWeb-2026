<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Element Form</title>
  </head>
  <body>
    <h1>Coba elemen-elemen form pada HTML</h1>

    <form>
      <label for="nama"
        >Nama:
        <input type="text" name="nama" id="nama" placeholder="Masukkan Nama" />
      </label>
      <label for="password"
        >Password: <input type="password" name="password" id="password" />
      </label>
    </form>
  </body>
</html>
